name: mercilith_app_template
description: >
  Shared Flutter infrastructure (theming, backup/restore, DB connection
  hardening, generic widgets, notification mechanism) for Mercilith's apps.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Theme schema, Themes table definition, and ThemeRepository interface only
  # — this package has no @DriftAccessor/@DriftDatabase classes of its own,
  # so no drift_dev/build_runner dev-dependency is needed. See CLAUDE.md.
  drift: ^2.28.2

  # Backup file I/O, theme import/export.
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  media_store_plus: ^0.1.3

  # Theme providers (activeThemeProvider/applyTheme pattern).
  flutter_riverpod: ^2.6.1
  collection: ^1.19.1

  # Notification mechanism (Android + Windows scheduling, action buttons).
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

  # Cross-device sync transport: pure-Dart MQTT client (no platform
  # channels, works identically on Android/Windows) and pure-Dart AEAD
  # encryption (no native code needed on Windows desktop). See CLAUDE.md,
  # "Cross-device sync transport."
  mqtt_client: ^10.11.0
  cryptography: ^2.9.0

  # Shared stylization/animation layer: declarative animation chaining +
  # shimmer (flutter_animate) and Material-team motion primitives for
  # page/tab transitions and container-transform (animations). Consuming
  # apps never import these directly — only the wrapper widgets exported
  # from lib/widgets/ and lib/theming/component_themes.dart. See CLAUDE.md.
  flutter_animate: ^4.5.2
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
